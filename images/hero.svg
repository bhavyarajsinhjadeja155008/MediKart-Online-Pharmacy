<svg xmlns="http://www.w3.org/2000/svg" width="400" height="320" viewBox="0 0 400 320">
  <!-- Hero illustration: medicine bottle, capsule and cross (SVG shapes + gradient) -->
  <defs>
    <linearGradient id="bottleGrad">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
  </defs>
  <ellipse cx="200" cy="295" rx="160" ry="14" fill="#000000" opacity="0.12"/>
  <!-- Bottle -->
  <rect x="120" y="40" width="110" height="40" rx="8" fill="#f59e0b"/>
  <rect x="105" y="78" width="140" height="210" rx="22" fill="url(#bottleGrad)"/>
  <rect x="125" y="140" width="100" height="90" rx="10" fill="#ffffff"/>
  <rect x="164" y="155" width="22" height="60" rx="3" fill="#0f766e"/>
  <rect x="145" y="174" width="60" height="22" rx="3" fill="#0f766e"/>
  <!-- Capsule -->
  <rect x="255" y="190" width="110" height="44" rx="22" fill="#ffffff"/>
  <rect x="255" y="190" width="55" height="44" rx="22" fill="#ef4444"/>
  <rect x="290" y="190" width="20" height="44" fill="#ef4444"/>
  <!-- Small tablets -->
  <circle cx="60" cy="250" r="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
  <circle cx="75" cy="200" r="16" fill="#fde68a"/>
  <!-- Star sparkle -->
  <polygon points="320,40 328,62 350,62 332,76 340,98 320,84 300,98 308,76 290,62 312,62" fill="#fde68a"/>
</svg>
